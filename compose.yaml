services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      HOTPEPPER_API_KEY: ${HOTPEPPER_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
